  <script defer src="https://cloud.umami.is/script.js" data-website-id="a5638b4a-87cc-4014-a56d-b5b83ae8ccd5"></script>
</head>
<body>

  <div class="lk-page">

    <!-- Logo & Tagline -->
    <header class="lk-header">
      <a href="https://amplifyr.ch" class="lk-logo" aria-label="Amplifyr – Startseite">
        <span>ampli</span><span class="lk-logo-fyr">fyr</span>
      </a>
      <p class="lk-tagline">KI-Transformation für Schweizer KMU</p>
    </header>

    <!-- Links (JS-rendered) -->
    <main class="lk-main" id="lk-root">
      <noscript>
        <p style="text-align:center;color:#445269;padding:24px">
          Bitte JavaScript aktivieren, um alle Links zu sehen.
        </p>
      </noscript>
    </main>

    <!-- Footer -->
    <footer class="lk-footer">
      <a href="https://amplifyr.ch" class="lk-footer-link">amplifyr.ch</a>
      <span aria-hidden="true">·</span>
      <span>© 2026 Amplifyr GmbH</span>
    </footer>

  </div>

  <script>
  // ============================================================
  //  LINK-DATEN — hier einfach bearbeiten
  //
  //  Typen: 'web' | 'linkedin' | 'instagram' | 'tel' | 'mail'
  //  Neue Person hinzufügen: Objekt in team[] einfügen.
  //  Link entfernen: Zeile aus links[] löschen.
  // ============================================================
  const LINKS = {

    company: [
      { type: 'linkedin',  label: 'LinkedIn',        url: 'https://www.linkedin.com/company/112354402' },
      { type: 'instagram', label: 'Instagram',       url: 'https://www.instagram.com/amplifyr.ch' },
      { type: 'tel',       label: '044 244 59 95',   url: 'tel:+41442445995' },
      { type: 'web',       label: 'amplifyr.ch',     url: 'https://amplifyr.ch' },
    ],

    team: [
      {
        name: 'Timo Steinfort',
        role: 'Co-Founder · Markt & Strategie',
        vcf: '/vcards/Timo_Steinfort.vcf',
        links: [
          { type: 'linkedin', label: 'LinkedIn',           url: 'https://www.linkedin.com/in/timo-steinfort-8571971a4/' },
          { type: 'tel',      label: '+41 44 244 59 98',  url: 'tel:+41442445998' },
          { type: 'mail',     label: 'timo@amplifyr.ch',  url: 'mailto:timo@amplifyr.ch' },
        ]
      },
      {
        name: 'David Staub',
        role: 'Co-Founder · Prozesse & Data Science',
        vcf: '/vcards/David_Staub.vcf',
        links: [
          { type: 'linkedin', label: 'LinkedIn',           url: 'https://www.linkedin.com/in/david-staub-456331237/' },
          { type: 'tel',      label: '+41 44 244 59 97',  url: 'tel:+41442445997' },
          { type: 'mail',     label: 'david@amplifyr.ch', url: 'mailto:david@amplifyr.ch' },
        ]
      },
      {
        name: 'Sinan Sen',
        role: 'Co-Founder · Systeme & Engineering',
        vcf: '/vcards/Sinan_Sen.vcf',
        links: [
          { type: 'linkedin', label: 'LinkedIn',           url: 'https://www.linkedin.com/in/sinan-sen-61299a22b/' },
          { type: 'tel',      label: '+41 44 244 59 96',  url: 'tel:+41442445996' },
          { type: 'mail',     label: 'sinan@amplifyr.ch', url: 'mailto:sinan@amplifyr.ch' },
        ]
      },
    ]

  };

  // ---- Icons (inline SVG) ----
  const ICONS = {
    web: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>`,
    linkedin: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>`,
    instagram: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>`,
    tel: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 014.49 12 19.79 19.79 0 011.41 3.37 2 2 0 013.41 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L7.91 8.38a16 16 0 005.61 5.61l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>`,
    mail: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
  };

  const ARROW = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const CHEVRON = `<svg class="lk-person-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const VCARD_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>`;

  // ---- vCard download ----
  function downloadVCard(person) {
    const parts = person.name.split(' ');
    const lastName = parts.pop();
    const firstName = parts.join(' ');
    const phone = (person.links.find(function(l){ return l.type === 'tel'; }) || {}).url || '';
    const email = (person.links.find(function(l){ return l.type === 'mail'; }) || {}).url || '';
    const lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + lastName + ';' + firstName + ';;;',
      'FN:' + person.name,
      'ORG:Amplifyr GmbH',
      'TITLE:' + person.role,
    ];
    if (phone) lines.push('TEL;TYPE=WORK,VOICE:' + phone.replace('tel:', ''));
    if (email) lines.push('EMAIL;TYPE=WORK,INTERNET:' + email.replace('mailto:', ''));
    lines.push('URL:https://www.amplifyr.ch');
    lines.push('END:VCARD');
    const vcf = lines.join('\r\n');
    const filename = person.name.replace(/\s+/g, '_') + '.vcf';

    // iOS: static .vcf URL → Safari triggers native "New Contact" dialog directly
    var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS && person.vcf) {
      window.location.href = person.vcf;
      return;
    }

    // Android / Desktop: blob download
    const blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 1000);
  }

  // ---- Render helpers ----
  function linkBtn(link, variant) {
    const isExternal = link.type !== 'mail' && link.type !== 'tel';
    const ext = isExternal ? ' target="_blank" rel="noopener"' : '';
    return `<a href="${link.url}" class="lk-btn lk-btn--${variant}"${ext}>
      <span class="lk-btn-icon">${ICONS[link.type] || ''}</span>
      <span class="lk-btn-label">${link.label}</span>
      <span class="lk-btn-arrow">${ARROW}</span>
    </a>`;
  }

  function render() {
    const root = document.getElementById('lk-root');

    const teamHTML = LINKS.team.map(function(person, i) {
      return `<div class="lk-person">
        <button class="lk-person-toggle" aria-expanded="false" aria-controls="lk-person-body-${i}">
          <div class="lk-person-info">
            <span class="lk-person-name">${person.name}</span>
            <span class="lk-person-role">${person.role}</span>
          </div>
          ${CHEVRON}
        </button>
        <div class="lk-person-body" id="lk-person-body-${i}" aria-hidden="true">
          <div class="lk-person-body-inner">
            <div class="lk-links">
              ${person.links.map(function(l){ return linkBtn(l, 'ghost'); }).join('')}
            </div>
            <button class="lk-vcard-btn" data-person-idx="${i}">
              ${VCARD_ICON}
              Kontakt hinzufügen
            </button>
          </div>
        </div>
      </div>`;
    }).join('');

    root.innerHTML = `
      <section class="lk-section lk-section--company" aria-label="Firma">
        <div class="lk-links lk-links--company">
          ${LINKS.company.map(function(l){ return linkBtn(l, 'primary'); }).join('')}
        </div>
      </section>

      <div class="lk-divider" aria-hidden="true"></div>

      <section class="lk-section" aria-label="Team">
        <p class="lk-section-label lk-section-label--center">Team</p>
        <div class="lk-team">${teamHTML}</div>
      </section>
    `;

    // Accordion
    root.querySelectorAll('.lk-person-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const isOpen = btn.getAttribute('aria-expanded') === 'true';
        // Close all
        root.querySelectorAll('.lk-person-toggle').forEach(function(b) {
          b.setAttribute('aria-expanded', 'false');
          const body = document.getElementById(b.getAttribute('aria-controls'));
          if (body) { body.classList.remove('is-open'); body.setAttribute('aria-hidden', 'true'); }
        });
        // Open this one if it was closed
        if (!isOpen) {
          btn.setAttribute('aria-expanded', 'true');
          const body = document.getElementById(btn.getAttribute('aria-controls'));
          if (body) { body.classList.add('is-open'); body.setAttribute('aria-hidden', 'false'); }
          if (window.innerWidth < 820) {
            setTimeout(function() {
              btn.closest('.lk-person').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
          }
        }
      });
    });

    // vCard buttons
    root.querySelectorAll('.lk-vcard-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const idx = parseInt(btn.getAttribute('data-person-idx'), 10);
        downloadVCard(LINKS.team[idx]);
      });
    });
  }

  render();
  </script>

</body>
</html>
