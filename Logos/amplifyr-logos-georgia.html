<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>amplifyr Logos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 40px;
  }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 56px;
    border-radius: 12px;
  }
  .logo-navy { background: #1a2744; }
  .logo-weiss { background: #FFFFFF; box-shadow: 0 2px 20px rgba(0,0,0,0.10); }
  .wordmark {
    font-family: Georgia, serif;
    font-weight: 900;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -1.5px;
  }
  .logo-navy .base { color: #FFFFFF; }
  .logo-weiss .base { color: #1a2744; }
  .fyr { color: #B0C4DE; font-style: italic; }
</style>
</head>
<body>
  <div class="logo logo-navy">
    <div class="wordmark"><span class="base">ampli</span><span class="fyr">fyr</span></div>
  </div>
  <div class="logo logo-weiss">
    <div class="wordmark"><span class="base">ampli</span><span class="fyr">fyr</span></div>
  </div>
</body>
</html>
