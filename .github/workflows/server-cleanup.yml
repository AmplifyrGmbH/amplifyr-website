name: Server aufräumen

# Entfernt Reste früherer Deploys vom Webserver. Diese Dateien gehören nicht
# ins Web, werden aber vom normalen Deploy nicht gelöscht, weil sie dort über
# die exclude-Liste laufen. Einmalig nach dem Relaunch 2026 gebraucht.
#
# Immer zuerst mit modus "auflisten" starten und das Protokoll prüfen,
# erst danach mit "loeschen" ausführen.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: 'auflisten (zeigt nur an) oder loeschen'
        required: true
        default: auflisten
        type: choice
        options:
          - auflisten
          - loeschen

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Zielverzeichnis anzeigen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-protect-data true
          cd /www/amplifyr.ch/
          echo "--- Dateien im Hauptverzeichnis ---"
          cls -1 --sort=name
          echo ""
          echo "--- Ordner scripts/ ---"
          cls -1 scripts/ || echo "(nicht vorhanden)"
          echo ""
          echo "--- Ordner archiv/ ---"
          cls -1 archiv/ || echo "(nicht vorhanden)"
          bye
          EOF

      - name: Aufräumen
        if: ${{ inputs.modus == 'loeschen' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Nur diese Pfade werden angefasst. Fehler bei einzelnen Einträgen
          # (z. B. bereits gelöscht) brechen den Lauf nicht ab.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftps://$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-protect-data true
          cd /www/amplifyr.ch/
          rm -f CLAUDE.md
          rm -f Betreiber.md
          rm -f dev-router.php
          rm -rf scripts
          rm -rf archiv
          echo ""
          echo "--- Danach ---"
          cls -1 --sort=name
          bye
          EOF

      - name: Ergebnis prüfen
        if: ${{ inputs.modus == 'loeschen' }}
        run: |
          fehler=0
          for pfad in CLAUDE.md Betreiber.md dev-router.php scripts/build-blog.js archiv/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.amplifyr.ch/$pfad")
            echo "$code  /$pfad"
            if [ "$code" = "200" ]; then fehler=1; fi
          done
          echo ""
          echo "--- Website erreichbar? ---"
          for pfad in "" handwerker kmu vorgehen kontakt blog/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.amplifyr.ch/$pfad")
            echo "$code  /$pfad"
            if [ "$code" != "200" ]; then fehler=1; fi
          done
          exit $fehler
